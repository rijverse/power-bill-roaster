name: Check DESCO Balance

# self-hosted mode: fork this repo, set the secrets below, and this workflow
# checks your balance on a schedule for free - no server needed.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-balance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check balance and send notifications
        env:
          DESCO_ACCOUNT_NO: ${{ secrets.DESCO_ACCOUNT_NO }}
          DESCO_METER_NO: ${{ secrets.DESCO_METER_NO }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          LOW_THRESHOLD: ${{ secrets.LOW_THRESHOLD }}
          CRITICAL_THRESHOLD: ${{ secrets.CRITICAL_THRESHOLD }}
        run: bun run check-balance
