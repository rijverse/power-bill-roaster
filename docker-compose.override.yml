# Local host-port overrides to dodge clashes with other running stacks.
# Untracked; safe to delete. !override replaces the base ports list
# (plain merge would append and still bind the clashing base ports).
services:
  postgres:
    ports: !override
      - '5435:5432'
  mockoon:
    ports: !override
      - '8089:8080' # 8088 taken on this host
  mailpit:
    ports: !override
      - '1026:1025' # 1025 taken on this host
      - '8026:8025'
