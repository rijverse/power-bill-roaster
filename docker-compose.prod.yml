# Production: app only - the database is Neon (managed Postgres).
# Usage on the server: docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - '3000:3000'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
