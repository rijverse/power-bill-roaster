name: Deploy

# on push to main: apply pending migrations, then build and push the image
# to ghcr.io/<owner>/<repo>:latest. the server pull/restart is manual, but
# the migration safety net means we never ship a new image with a schema
# change that hasn't been applied first. needs DATABASE_URL in repo secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # pin to the version we test against locally so prod doesn't drift
          # when Bun ships a new major. bump deliberately.
          bun-version: 1.1.33

      - run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  build-image:
    name: Build & push image
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
