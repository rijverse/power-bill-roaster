name: Deploy

# on push to main: apply pending migrations, then build and push the image to
# ghcr.io/<owner>/<repo>, tagged both :latest and :<sha>. the immutable :<sha>
# tag is the rollback handle - pin the server to a known-good one if :latest
# breaks. the server pull/restart is manual, but the migration safety net means
# we never ship a new image with a schema change that hasn't been applied first.
# needs DATABASE_URL as a "production" environment secret (see the migrate job).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    # this step writes to the live DB with a production credential. scope it to a
    # protected GitHub Environment (Settings > Environments > "production": add
    # required reviewers / a branch rule) and hold DATABASE_URL there, so a stray
    # push to main can't silently migrate prod without a human approving it.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # pin to the version we test against locally so prod doesn't drift
          # when Bun ships a new major. bump deliberately.
          bun-version: 1.2.23

      - run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  build-image:
    name: Build & push image
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
