# local dev: Postgres + Mockoon faking the Telegram and DESCO APIs.
# Run the app on the host with: bun run dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: powerroast
      POSTGRES_PASSWORD: powerroast
      POSTGRES_DB: powerroast
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  mockoon:
    image: mockoon/cli:9.7.0
    command: ['--data', '/data/mock.json', '--port', '8080', '--log-transaction']
    ports:
      - '8080:8080'
    volumes:
      - ./mock/telegram-desco-mock.json:/data/mock.json:ro

  # Catch-all SMTP for local email testing. 1025 = SMTP, 8025 = web inbox.
  mailpit:
    image: axllent/mailpit:v1.30.5
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
